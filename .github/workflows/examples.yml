name: Validate public examples

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Syntax, format and public JSON checks
        run: |
          node --check examples/node/boltutil-demo.js
          python -m py_compile examples/python/boltutil_demo.py examples/tests/contract_test.py
          test -z "$(gofmt -d examples/go/boltutil_demo.go)"
          php -l examples/php/boltutil_demo.php
          node -e "JSON.parse(require('fs').readFileSync('postman/BoltUtil.postman_collection.json', 'utf8'))"
      - name: Six-language merchant API and webhook contract tests
        # Uses only loopback HTTP, synthetic credentials and synthetic events.
        # Java/Maven, Go and C# are built by the harness. No live orders/emails.
        run: python examples/tests/contract_test.py --languages node python go java csharp php
